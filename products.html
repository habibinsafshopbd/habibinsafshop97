<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমাদের পণ্য - Habib Insaf Shop</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <button class="menu-btn" onclick="history.back()">←</button>

    <div class="brand">
        <h1>Habib Insaf Shop</h1>
    </div>

</header>

<h2>📦 আমাদের পণ্য</h2>

<div class="category-buttons">
    <button onclick="filterProducts('all')">সব</button>
    <button onclick="filterProducts('tupi')">টুপি</button>
    <button onclick="filterProducts('honey')">মধু</button>
    <button onclick="filterProducts('attar')">আতার</button>
</div>

<div class="products" id="products">
</div>

<script>
function filterProducts(category){

    let products=document.querySelectorAll(".product");

    products.forEach(function(product){

        if(category==="all"){
            product.style.display="block";
        }else if(product.classList.contains(category)){
            product.style.display="block";
        }else{
            product.style.display="none";
        }

    });

}
</script>

</body>
</html>
