<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমাদের পণ্য - Habib Insaf Shop</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <button class="menu-btn" onclick="history.back()">←</button>

    <div class="brand">
        <h1>Habib Insaf Shop</h1>
    </div>

</header>

<h2>📦 আমাদের পণ্য</h2>

<div class="category-buttons">
    <button onclick="filterProducts('all')">সব</button>
    <button onclick="filterProducts('tupi')">টুপি</button>
    <button onclick="filterProducts('honey')">মধু</button>
    <button onclick="filterProducts('attar')">আতার</button>
</div>

<div class="products" id="products">
</div>

<script>
function filterProducts(category){

    let products=document.querySelectorAll(".product");

    products.forEach(function(product){

        if(category==="all"){
            product.style.display="block";
        }else if(product.classList.contains(category)){
            product.style.display="block";
        }else{
            product.style.display="none";
        }

    });

}
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDMQSGBuHukkUaJdktUeaA6-4xnSRKaPjs",
  authDomain: "habib-insaf-shop.firebaseapp.com",
  projectId: "habib-insaf-shop",
  storageBucket: "habib-insaf-shop.firebasestorage.app",
  messagingSenderId: "1061560355803",
  appId: "1:1061560355803:web:fde04cfdd52ecabd20f5fe"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const productsDiv = document.getElementById("products");

async function loadProducts() {

  const querySnapshot = await getDocs(collection(db, "products"));

  querySnapshot.forEach((doc) => {

    const p = doc.data();

    productsDiv.innerHTML += `
      <div class="product ${p.category}">
        <img src="${p.image}" width="150">
        <h3>${p.name}</h3>

        <p>
          ${p.offerPrice ? `<del>৳ ${p.regularPrice}</del><br><b>৳ ${p.offerPrice}</b>` : `৳ ${p.regularPrice}`}
        </p>

        <p>${p.description || ""}</p>

<button onclick="location.href='order.html?id=${doc.id}'">
🛒 অর্ডার করুন
</button>
      </div>
    `;

  });

}

loadProducts();
</script>
</body>
</html>
