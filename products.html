<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমাদের পণ্য - Habib Insaf Shop</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <button class="menu-btn" onclick="history.back()">←</button>

    <div class="brand">
        <h1>Habib Insaf Shop</h1>
    </div>

</header>

<h2>পণ্য</h2>
<!-- 🔍 পণ্য সার্চ -->
<div class="search-box">
    <input type="text" id="searchInput" placeholder="পণ্যের নাম লিখে খুঁজুন..." oninput="searchProducts()">
    <span>🔍</span>
</div>
<div class="category-buttons" id="categoryButtons">
    <button onclick="filterProducts('all')">সব</button>
</div>
<div class="products" id="products"></div>
<script>
function filterProducts(category){

    let products=document.querySelectorAll(".product");

    products.forEach(function(product){

        if(category==="all"){
            product.style.display="block";
        }else if(product.classList.contains(category)){
            product.style.display="block";
        }else{
            product.style.display="none";
        }

    });

}
function searchProducts(){

    let search =
        document.getElementById("searchInput").value.toLowerCase();

    let products =
        document.querySelectorAll(".product");

    products.forEach(function(product){

        let name =
            product.querySelector("h3").innerText.toLowerCase();

        if(name.includes(search)){
            product.style.display="block";
        }else{
            product.style.display="none";
        }

    });

}
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDMQSGBuHukkUaJdktUeaA6-4xnSRKaPjs",
  authDomain: "habib-insaf-shop.firebaseapp.com",
  projectId: "habib-insaf-shop",
  storageBucket: "habib-insaf-shop.firebasestorage.app",
  messagingSenderId: "1061560355803",
  appId: "1:1061560355803:web:fde04cfdd52ecabd20f5fe"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const productsDiv = document.getElementById("products");
const categoryButtons = document.getElementById("categoryButtons");
const categories = new Set();

async function loadProducts() {

  const querySnapshot = await getDocs(collection(db, "products"));

  querySnapshot.forEach((doc) => {

    const p = doc.data();
    
    categories.add(p.category);

    productsDiv.innerHTML += `
<div class="product ${p.category || ""}">

  <img src="${p.images ? p.images[0] : ''}"
       width="150"
       style="cursor:pointer"
       onclick="location.href='product.html?id=${doc.id}'">

<h3 style="cursor:pointer"
onclick="location.href='product.html?id=${doc.id}'">
${p.name}
</h3>

<p style="cursor:pointer"
onclick="location.href='product.html?id=${doc.id}'">
${p.offerPrice
? `
<del>৳ ${p.regularPrice}</del><br>
<b>৳ ${p.offerPrice}</b><br>
<span style="color:red;font-size:14px;font-weight:bold;">
${Math.round((1 - p.offerPrice / p.regularPrice) * 100)}%
</span>
`
: `৳ ${p.regularPrice}`}
</p>

</div>
`;

  });

categories.forEach(category => {
    categoryButtons.innerHTML += `
        <button onclick="filterProducts('${category}')">
            ${category}
        </button>
    `;
});

}

loadProducts();
</script>
</body>
</html>
