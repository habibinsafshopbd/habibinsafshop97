<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>পণ্য মুছুন</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    padding:20px;
}

.box{
    max-width:450px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.2);
}

h2{
    text-align:center;
    color:red;
}

select,button{
    width:100%;
    padding:12px;
    margin:10px 0;
    box-sizing:border-box;
}

button{
    background:red;
    color:white;
    border:none;
    border-radius:6px;
    font-size:16px;
    cursor:pointer;
}
</style>

</head>

<body>

<div class="box">

<h2>🗑️ পণ্য মুছুন</h2>

<select id="productList">
<option value="">পণ্য নির্বাচন করুন</option>
</select>

<button onclick="deleteProduct()">🗑️ Delete Product</button>

</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  deleteDoc,
  doc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDMQSGBuHukkUaJdktUeaA6-4xnSRKaPjs",
  authDomain: "habib-insaf-shop.firebaseapp.com",
  projectId: "habib-insaf-shop",
  storageBucket: "habib-insaf-shop.firebasestorage.app",
  messagingSenderId: "1061560355803",
  appId: "1:1061560355803:web:fde04cfdd52ecabd20f5fe"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const select = document.getElementById("productList");

async function loadProducts() {
  const querySnapshot = await getDocs(collection(db, "products"));

  querySnapshot.forEach((item) => {
    const option = document.createElement("option");
    option.value = item.id;
    option.textContent = item.data().name;
    select.appendChild(option);
  });
}

window.deleteProduct = async function () {

  if (select.value == "") {
    alert("একটি পণ্য নির্বাচন করুন");
    return;
  }

  if (confirm("এই পণ্যটি মুছে ফেলতে চান?")) {

    await deleteDoc(doc(db, "products", select.value));

    alert("পণ্য মুছে ফেলা হয়েছে");

    location.reload();
  }
}

loadProducts();
</script>
</body>
</html>
