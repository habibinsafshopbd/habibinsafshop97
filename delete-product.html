<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>পণ্য মুছুন</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    padding:20px;
}

.box{
    max-width:450px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.2);
}

h2{
    text-align:center;
    color:red;
}

select,button{
    width:100%;
    padding:12px;
    margin:10px 0;
    box-sizing:border-box;
}

button{
    background:red;
    color:white;
    border:none;
    border-radius:6px;
    font-size:16px;
    cursor:pointer;
}
</style>

</head>

<body>

<div class="box">

<h2>🗑️ পণ্য মুছুন</h2>

<select id="productList">
<option value="">পণ্য নির্বাচন করুন</option>
</select>

<button onclick="deleteProduct()">🗑️ Delete Product</button>

</div>

</body>
</html>
