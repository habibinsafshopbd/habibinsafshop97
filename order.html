<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>অর্ডার করুন</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f5f5;
padding:20px;
}

.box{
max-width:450px;
margin:auto;
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.2);
}

h2{
text-align:center;
color:#006B3C;
}

input,textarea{
width:100%;
padding:12px;
margin:10px 0;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
background:#006B3C;
color:#fff;
border:none;
border-radius:6px;
font-size:16px;
cursor:pointer;
}

.priceBox{
background:#f8f8f8;
padding:10px;
border-radius:8px;
margin:15px 0;
}

.priceBox p{
margin:8px 0;
font-size:16px;
}

.total{
font-size:20px;
color:red;
font-weight:bold;
}
</style>

</head>

<body>

<div class="box">

<h2>🛒 অর্ডার করুন</h2>

<input type="text" id="product" placeholder="পণ্যের নাম" readonly>

<input type="text" id="name" placeholder="আপনার নাম">

<input type="tel" id="phone" placeholder="মোবাইল নম্বর">

<textarea id="address" placeholder="সম্পূর্ণ ঠিকানা"></textarea>

<input type="number" id="qty" value="1" min="1">

<h3>সাইজ নির্বাচন</h3>
<div id="sizeOptions"></div>

<h3>রং নির্বাচন</h3>
<div id="colorOptions"></div>

<textarea id="note" placeholder="মন্তব্য (ঐচ্ছিক)"></textarea>

<h3>ডেলিভারি এলাকা</h3>

<label>
<input type="radio" name="delivery" value="60" onclick="calculateTotal()">
নরসিংদীর ভিতরে (৳60)
</label>

<br><br>

<label>
<input type="radio" name="delivery" value="115" onclick="calculateTotal()">
নরসিংদীর বাইরে (৳115)
</label>

<div class="priceBox">

<p>পণ্যের দাম :
<b>৳ <span id="productPrice">0</span></b></p>

<p>ডেলিভারি :
<b>৳ <span id="deliveryPrice">0</span></b></p>

<p class="total">
মোট :
৳ <span id="totalPrice">0</span>
</p>

</div>

<button onclick="orderNow()">
✅ অর্ডার কনফার্ম করুন
</button>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {
  getFirestore,
  doc,
  getDoc,
  collection,
  addDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDMQSGBuHukkUaJdktUeaA6-4xnSRKaPjs",
  authDomain: "habib-insaf-shop.firebaseapp.com",
  projectId: "habib-insaf-shop",
  storageBucket: "habib-insaf-shop.firebasestorage.app",
  messagingSenderId: "1061560355803",
  appId: "1:1061560355803:web:fde04cfdd52ecabd20f5fe"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let productPrice = 0;

const params = new URLSearchParams(window.location.search);
const productId = params.get("id");

window.calculateTotal = function () {

  const qty = Number(document.getElementById("qty").value) || 1;

  const selected = document.querySelector('input[name="delivery"]:checked');

  let delivery = selected ? Number(selected.value) : 0;

  const productTotal = productPrice * qty;

  document.getElementById("productPrice").innerText = productTotal;
  document.getElementById("deliveryPrice").innerText = delivery;
  document.getElementById("totalPrice").innerText = productTotal + delivery;
};

if (productId) {
  const snap = await getDoc(doc(db, "products", productId));

  if (snap.exists()) {

    const data = snap.data();

    document.getElementById("product").value = data.name;

productPrice = Number(data.offerPrice || data.regularPrice);

// সাইজ দেখাবে
if (data.sizes && data.sizes.length > 0) {

  let html = "";

  data.sizes.forEach(size => {
    html += `
      <label>
        <input type="radio" name="size" value="${size}">
        ${size}
      </label><br>
    `;
  });

  document.getElementById("sizeOptions").innerHTML = html;
}

// রং দেখাবে
if (data.colors && data.colors.length > 0) {

  let html = "";

  data.colors.forEach(color => {
    html += `
      <label>
        <input type="radio" name="color" value="${color}">
        ${color}
      </label><br>
    `;
  });

  document.getElementById("colorOptions").innerHTML = html;
}

calculateTotal();
}   // 👈 এটা যোগ করুন

}
document.getElementById("qty").addEventListener("input", calculateTotal);

window.orderNow = async function () {

  const product = document.getElementById("product").value;
  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;
  const address = document.getElementById("address").value;
  const qty = document.getElementById("qty").value;
  const note = document.getElementById("note").value;
const size =
document.querySelector('input[name="size"]:checked')?.value || "";

const color =
document.querySelector('input[name="color"]:checked')?.value || "";

// সাইজ অপশন থাকলে নির্বাচন বাধ্যতামূলক
if(document.querySelectorAll('input[name="size"]').length>0 && !size){
    alert("সাইজ নির্বাচন করুন");
    return;
}

// রং অপশন থাকলে নির্বাচন বাধ্যতামূলক
if(document.querySelectorAll('input[name="color"]').length>0 && !color){
    alert("রং নির্বাচন করুন");
    return;
}
  const selected = document.querySelector('input[name="delivery"]:checked');

  if (!selected) {
    alert("ডেলিভারি এলাকা নির্বাচন করুন");
    return;
  }

  if (!product || !name || !phone || !address) {
    alert("সব তথ্য পূরণ করুন");
    return;
  }

  const delivery = Number(selected.value);
  const total = (productPrice * Number(qty)) + delivery;

  await addDoc(collection(db, "orders"), {
  product,
  name,
  phone,
  address,
  qty,
  size,
  color,
  note,
  delivery,
  total,
  status: "Pending",
  time: new Date()
});

  alert("অর্ডার সফলভাবে গ্রহণ করা হয়েছে");

  location.href = "products.html";
};
</script>

</body>
</html>
