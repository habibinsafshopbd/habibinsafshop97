<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>অর্ডার করুন</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    padding:20px;
}

.box{
    max-width:450px;
    margin:auto;
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.2);
}

h2{
    text-align:center;
    color:#006B3C;
}

input,textarea{
    width:100%;
    padding:12px;
    margin:10px 0;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    background:#006B3C;
    color:white;
    border:none;
    border-radius:6px;
    font-size:16px;
    cursor:pointer;
}
</style>

</head>

<body>

<div class="box">

<h2>🛒 অর্ডার করুন</h2>

<input type="text" id="product" placeholder="পণ্যের নাম">

<input type="text" id="name" placeholder="আপনার নাম">

<input type="tel" id="phone" placeholder="মোবাইল নম্বর">

<textarea id="address" placeholder="সম্পূর্ণ ঠিকানা"></textarea>

<input type="number" id="qty" placeholder="পরিমাণ" value="1">

<textarea id="note" placeholder="মন্তব্য (ঐচ্ছিক)"></textarea>

<button onclick="orderNow()">✅ অর্ডার কনফার্ম করুন</button>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {
getFirestore,
doc,
getDoc,
collection,
addDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyDMQSGBuHukkUaJdktUeaA6-4xnSRKaPjs",
authDomain: "habib-insaf-shop.firebaseapp.com",
projectId: "habib-insaf-shop",
storageBucket: "habib-insaf-shop.firebasestorage.app",
messagingSenderId: "1061560355803",
appId: "1:1061560355803:web:fde04cfdd52ecabd20f5fe"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const params = new URLSearchParams(window.location.search);
const productId = params.get("id");

if(productId){
const snap = await getDoc(doc(db,"products",productId));
if(snap.exists()){
document.getElementById("product").value = snap.data().name;
}
}

window.orderNow = async function(){

const product=document.getElementById("product").value;
const name=document.getElementById("name").value;
const phone=document.getElementById("phone").value;
const address=document.getElementById("address").value;
const qty=document.getElementById("qty").value;
const note=document.getElementById("note").value;

if(!product || !name || !phone || !address){
alert("সব তথ্য পূরণ করুন");
return;
}

await addDoc(collection(db,"orders"),{
product,
name,
phone,
address,
qty,
note,
status:"Pending",
time:new Date()
});

alert("অর্ডার সফলভাবে গ্রহণ করা হয়েছে");

document.getElementById("name").value="";
document.getElementById("phone").value="";
document.getElementById("address").value="";
document.getElementById("qty").value="1";
document.getElementById("note").value="";
}
</script>

</body>
</html>
