<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>পণ্যের বিস্তারিত</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f5f5f5;
margin:0;
padding:15px;
}

.box{
max-width:500px;
margin:auto;
background:#fff;
padding:15px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.2);
}

.slider{
position:relative;
text-align:center;
}

.slider img{
width:100%;
height:350px;
object-fit:cover;
border-radius:10px;
}

.prev,
.next{
position:absolute;
top:45%;
transform:translateY(-50%);
background:#000;
color:#fff;
border:none;
padding:10px;
cursor:pointer;
opacity:.7;
}

.prev{
left:10px;
}

.next{
right:10px;
}

.thumbs{
display:flex;
overflow-x:auto;
gap:8px;
margin-top:10px;
}

.thumbs img{
width:70px;
height:70px;
object-fit:cover;
border:2px solid #ddd;
border-radius:6px;
cursor:pointer;
}

.thumbs img.active{
border:2px solid green;
}

h2{
margin-top:15px;
}

.price del{
color:#777;
}

.offer{
color:red;
font-size:24px;
font-weight:bold;
}

.desc{
margin-top:15px;
line-height:1.6;
}

.optionBox{
margin-top:15px;
}

.optionBox label{
display:block;
margin:6px 0;
}

.orderBtn{
display:block;
width:100%;
padding:15px;
margin-top:20px;
background:#006B3C;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="box">

<div class="slider">

<button class="prev" onclick="prevImage()">◀</button>

<img id="mainImage">

<button class="next" onclick="nextImage()">▶</button>

</div>

<div class="thumbs" id="thumbs"></div>

<h2 id="productName"></h2>

<div class="price">
<del id="regularPrice"></del><br>
<span class="offer" id="offerPrice"></span>
</div>

<div class="desc" id="description"></div>

<button class="orderBtn" id="orderBtn">
🛒 অর্ডার করুন
</button>

<div id="orderForm" style="display:none; margin-top:20px;">

<h3>সাইজ</h3>
<div id="sizeOptions"></div>

<h3>রং</h3>
<div id="colorOptions"></div>

<input type="text" id="customerName" placeholder="আপনার নাম">

<input type="tel" id="customerPhone" placeholder="মোবাইল নম্বর">

<textarea id="customerAddress" placeholder="ঠিকানা"></textarea>

<input type="number" id="quantity" value="1" min="1" placeholder="পরিমাণ">

<!-- এখানেই বসবে ↓ -->

<h3>মোট দাম</h3>

<p id="totalPrice">৳ 0</p>

<h3>ডেলিভারি চার্জ</h3>

<select id="deliveryCharge" onchange="calculateTotal()">
    <option value="80">ঢাকার ভিতরে - ৳80</option>
    <option value="130">ঢাকার বাইরে - ৳130</option>
</select>

<h3>সর্বমোট</h3>

<p id="grandTotal">৳ 0</p>

<button id="confirmOrderBtn" class="orderBtn">
✅ অর্ডার কনফার্ম করুন
</button>

</div>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {
getFirestore,
doc,
getDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyDMQSGBuHukkUaJdktUeaA6-4xnSRKaPjs",
authDomain: "habib-insaf-shop.firebaseapp.com",
projectId: "habib-insaf-shop",
storageBucket: "habib-insaf-shop.firebasestorage.app",
messagingSenderId: "1061560355803",
appId: "1:1061560355803:web:fde04cfdd52ecabd20f5fe"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const params = new URLSearchParams(window.location.search);
const productId = params.get("id");

let images = [];
let current = 0;
let data = {};

function showImage(index){

current = index;

document.getElementById("mainImage").src = images[index];

const thumbs = document.querySelectorAll(".thumbs img");

thumbs.forEach((img,i)=>{
img.classList.toggle("active",i===index);
});

}

window.prevImage = function(){

if(current>0){

showImage(current-1);

}

}

window.nextImage = function(){

if(current<images.length-1){

showImage(current+1);

}

}
function calculateTotal(){

    const qty = Number(document.getElementById("quantity").value) || 1;

    const price = Number(data.offerPrice || data.regularPrice);

    const delivery = Number(document.getElementById("deliveryCharge").value);

    const total = qty * price;

    document.getElementById("totalPrice").innerText = "৳ " + total;

    document.getElementById("grandTotal").innerText = "৳ " + (total + delivery);

}
if(productId){

const snap = await getDoc(doc(db,"products",productId));

if(snap.exists()){

data = snap.data();

images = data.images || [];

document.getElementById("productName").innerText = data.name;

document.getElementById("regularPrice").innerText =
"৳ " + data.regularPrice;

document.getElementById("offerPrice").innerText =
"৳ " + (data.offerPrice || data.regularPrice);

document.getElementById("description").innerText =
data.description || "";

const thumbs = document.getElementById("thumbs");

images.forEach((img,index)=>{

thumbs.innerHTML += `
<img src="${img}" onclick="showImage(${index})">
`;

});

showImage(0);

calculateTotal();

document.getElementById("quantity").oninput = calculateTotal;
document.getElementById("deliveryCharge").onchange = calculateTotal;

window.calculateTotal = calculateTotal;

// সাইজ দেখাবে
if(data.sizes && data.sizes.length>0){

let html="";

data.sizes.forEach(size=>{

html += `
<label>
<input type="radio" name="size" value="${size}">
${size}
</label><br>
`;

});

document.getElementById("sizeOptions").innerHTML = html;

}

// রং দেখাবে
if(data.colors && data.colors.length>0){

let html="";

data.colors.forEach(color=>{

html += `
<label>
<input type="radio" name="color" value="${color}">
${color}
</label><br>
`;

});

document.getElementById("colorOptions").innerHTML = html;

}

document.getElementById("orderBtn").onclick = function(){

document.getElementById("orderForm").style.display = "block";

this.style.display = "none";

};

}

}

window.showImage = showImage;;

</script>

</body>
</html>
