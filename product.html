<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>পণ্যের বিস্তারিত</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f5f5f5;
margin:0;
padding:15px;
}

.box{
max-width:500px;
margin:auto;
background:#fff;
padding:15px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.2);
}

.slider{
position:relative;
text-align:center;
}

.slider img{
width:100%;
height:350px;
object-fit:cover;
border-radius:10px;
}

.prev,
.next{
position:absolute;
top:45%;
transform:translateY(-50%);
background:#000;
color:#fff;
border:none;
padding:10px;
cursor:pointer;
opacity:.7;
}

.prev{
left:10px;
}

.next{
right:10px;
}

.thumbs{
display:flex;
overflow-x:auto;
gap:8px;
margin-top:10px;
}

.thumbs img{
width:70px;
height:70px;
object-fit:cover;
border:2px solid #ddd;
border-radius:6px;
cursor:pointer;
}

.thumbs img.active{
border:2px solid green;
}

h2{
margin-top:15px;
}

.price del{
color:#777;
}

.offer{
color:red;
font-size:24px;
font-weight:bold;
}

.desc{
margin-top:15px;
line-height:1.6;
}

.optionBox{
margin-top:15px;
}

.optionBox label{
display:block;
margin:6px 0;
}

.orderBtn{
display:block;
width:100%;
padding:15px;
margin-top:20px;
background:#006B3C;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="box">

<div class="slider">
    <img id="mainImage">
</div>

</div>

<div class="thumbs" id="thumbs"></div>

<h2 id="productName"></h2>

<div class="price">
<del id="regularPrice"></del><br>
<span class="offer" id="offerPrice"></span>
</div>
<h3> পণ্যের বিবরণ</h3>
<div class="desc" id="description"></div>

<button class="orderBtn" id="orderBtn">
🛒 অর্ডার করুন
</button>

<div id="orderForm" style="display:none; margin-top:20px;">

<h3>সাইজ</h3>
<div id="sizeOptions"></div>

<h3>রং</h3>
<div id="colorOptions"></div>

<input type="text" id="customerName" placeholder="আপনার নাম">

<input type="tel" id="customerPhone" placeholder="মোবাইল নম্বর">

<textarea id="customerAddress" placeholder="ঠিকানা"></textarea>

<input type="number" id="quantity" value="1" min="1" placeholder="পরিমাণ">

<!-- এখানেই বসবে ↓ -->
<h3>মোট ওজন</h3>

<select id="weight" onchange="calculateTotal()">
    <option value="0.5">৫০০ গ্রাম পর্যন্ত</option>
  <option value="1">১ কেজি পর্যন্ত</option>
<option value="2">২ কেজি পর্যন্ত</option>
<option value="3">৩ কেজি পর্যন্ত</option>
<option value="4">৪ কেজি পর্যন্ত</option>
<option value="5">৫ কেজি পর্যন্ত</option>
<option value="6">৬ কেজি পর্যন্ত</option>
<option value="7">৭ কেজি পর্যন্ত</option>
<option value="8">৮ কেজি পর্যন্ত</option>
<option value="9">৯ কেজি পর্যন্ত</option>
<option value="10">১০ কেজি পর্যন্ত</option>

</select>

<p style="font-size:14px; color:#d35400; margin:5px 0;">
⚠️ শুধু মধু, মধুময় বাদাম, খেজুর, কাজুবাদাম, কাঠবাদাম ও তেলের জন্য ওজন নির্বাচন করুন।
</p>
<h3>মোট দাম</h3>

<p id="totalPrice">৳ 0</p>

<h3>ডেলিভারি চার্জ</h3>

<select id="deliveryCharge" onchange="calculateTotal()">
    <option value="60">নরসিংদী ভিতরে - ৳60</option>
    <option value="115">নরসিংদী বাইরে - ৳115</option>
</select>
<h3>পেমেন্ট মাধ্যম</h3>


<select id="paymentMethod">
    <option value="Cash on Delivery">ক্যাশ অন ডেলিভারি</option>
    <option value="bKash">বিকাশ</option>
    <option value="Nagad">নগদ</option>
    <option value="Rocket">রকেট</option>
    <option value="Bank">ব্যাংক একাউন্ট</option>
</select>

<div id="paymentInfo" style="margin-top:10px;color:green;font-weight:bold;"></div>
<input
  type="text"
  id="senderLast4"
  maxlength="4"
  placeholder="টাকা পাঠানোর নম্বরের শেষ 4 সংখ্যা দিন">
<h3>সর্বমোট</h3>

<p id="grandTotal">৳ 0</p>
<button id="confirmOrderBtn" class="orderBtn">
✅ অর্ডার কনফার্মকরুন
</button>

</div>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {
getFirestore,
doc,
getDoc,
collection,
addDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {
apiKey: "AIzaSyDMQSGBuHukkUaJdktUeaA6-4xnSRKaPjs",
authDomain: "habib-insaf-shop.firebaseapp.com",
projectId: "habib-insaf-shop",
storageBucket: "habib-insaf-shop.firebasestorage.app",
messagingSenderId: "1061560355803",
appId: "1:1061560355803:web:fde04cfdd52ecabd20f5fe"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const params = new URLSearchParams(window.location.search);
const productId = params.get("id");

let images = [];
let current = 0;
let data = {};

function showImage(index){

current = index;

document.getElementById("mainImage").src = images[index];

const thumbs = document.querySelectorAll(".thumbs img");

thumbs.forEach((img,i)=>{
img.classList.toggle("active",i===index);
});

}

window.prevImage = function(){

if(current>0){

showImage(current-1);

}

}

window.nextImage = function(){

if(current<images.length-1){

showImage(current+1);

}

}
function calculateTotal(){

    const qty = Number(document.getElementById("quantity").value) || 1;
    const price = Number(data.offerPrice || data.regularPrice);
    const weight = Number(document.getElementById("weight").value);

    let delivery = 0;

    if(document.getElementById("deliveryCharge").selectedIndex == 0){

    if(weight === 0.5){
        delivery = 60;
    } else {
        delivery = 80 + (weight - 1) * 20;
    }

    document.getElementById("deliveryCharge").options[0].text =
        "নরসিংদী ভিতরে - ৳" + delivery;

}else{

    if(weight === 0.5){
        delivery = 115;
    } else {
        delivery = 135 + (weight - 1) * 20;
    }

    document.getElementById("deliveryCharge").options[1].text =
        "নরসিংদী বাইরে - ৳" + delivery;
}


    const total = qty * price;

    document.getElementById("totalPrice").innerText = "৳ " + total;
    document.getElementById("grandTotal").innerText = "৳ " + (total + delivery);
}
if(productId){

const snap = await getDoc(doc(db,"products",productId));

if(snap.exists()){

data = snap.data();

images = data.images || [];

document.getElementById("productName").innerText = data.name;

document.getElementById("regularPrice").innerText =
"৳ " + data.regularPrice;

document.getElementById("offerPrice").innerText =
"৳ " + (data.offerPrice || data.regularPrice);

document.getElementById("description").innerText =
data.description || "";

const thumbs = document.getElementById("thumbs");

images.forEach((img,index)=>{

thumbs.innerHTML += `
<img src="${img}" onclick="showImage(${index})">
`;

});

showImage(0);

calculateTotal();

document.getElementById("quantity").oninput = calculateTotal;
document.getElementById("deliveryCharge").onchange = calculateTotal;
document.getElementById("weight").onchange = calculateTotal;

window.calculateTotal = calculateTotal;

// সাইজ দেখাবে
if(data.sizes && data.sizes.length>0){

let html="";

data.sizes.forEach(size=>{

html += `
<label>
<input type="radio" name="size" value="${size}">
${size}
</label><br>
`;

});

document.getElementById("sizeOptions").innerHTML = html;

}

// রং দেখাবে
if(data.colors && data.colors.length>0){

let html="";

data.colors.forEach(color=>{

html += `
<label>
<input type="radio" name="color" value="${color}">
${color}
</label><br>
`;

});

document.getElementById("colorOptions").innerHTML = html;

}

document.getElementById("orderBtn").addEventListener("click", function () {

    document.getElementById("orderForm").style.display = "block";

    this.style.display = "none";

});

}

}
const paymentMethod = document.getElementById("paymentMethod");
const paymentInfo = document.getElementById("paymentInfo");

paymentMethod.onchange = function () {

  if (this.value === "bKash") {
    paymentInfo.innerHTML = "বিকাশ নম্বর: 01793795727";
  } else if (this.value === "Nagad") {
    paymentInfo.innerHTML = "নগদ নম্বর: 01793795727";
  } else if (this.value === "Rocket") {
    paymentInfo.innerHTML = "রকেট নম্বর: 01793795727";
  } else if (this.value === "Bank") {
    paymentInfo.innerHTML = "ব্যাংক একাউন্ট: 20507770227448420";
  } else {
    paymentInfo.innerHTML = "ক্যাশ অন ডেলিভারিতে অগ্রিম লাগবে না।";
  }

};

paymentMethod.onchange();
document.getElementById("confirmOrderBtn").onclick = async function () {

    const name = document.getElementById("customerName").value.trim();
    const phone = document.getElementById("customerPhone").value.trim();
    const address = document.getElementById("customerAddress").value.trim();

    const qty = document.getElementById("quantity").value;

    const size = document.querySelector('input[name="size"]:checked')?.value || "";

    const color = document.querySelector('input[name="color"]:checked')?.value || "";
const paymentMethod =
document.getElementById("paymentMethod").value;
const senderLast4 =
document.getElementById("senderLast4").value.trim();
    const total = document.getElementById("grandTotal").innerText;

    if (!name || !phone || !address) {
        alert("সব তথ্য পূরণ করুন");
        return;
    }
// পেমেন্ট করা হলে শেষ ৪ সংখ্যা বাধ্যতামূলক
if (paymentMethod !== "Cash on Delivery") {

    if (!/^\d{4}$/.test(senderLast4)) {
        alert("টাকা পাঠানোর নম্বরের শেষ ৪ সংখ্যা দিন।");
        return;
    }

}
    try {

        await addDoc(collection(db, "orders"), {
            productId: productId,
            productName: data.name,
            regularPrice: data.regularPrice,
            offerPrice: data.offerPrice,
            quantity: qty,
            size: size,
            color: color,
            customerName: name,
            customerPhone: phone,
            customerAddress: address,
            paymentMethod: paymentMethod,
            senderLast4: senderLast4,
            total: total,
            status: "Pending",
            createdAt: new Date()
        });

        alert("অর্ডার সফলভাবে সংরক্ষণ হয়েছে");

    } catch (error) {
        alert("অর্ডার সংরক্ষণ করা যায়নি");
        console.error(error);
   }

};

window.showImage = showImage;;

</script>

</body><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Page title</title>
</head>
<body>
    
</body>
</html>
</html>
