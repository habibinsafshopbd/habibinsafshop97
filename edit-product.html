<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>পণ্য সম্পাদনা</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f5f5;
padding:20px;
}

.box{
max-width:450px;
margin:auto;
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.2);
}

h2{
text-align:center;
color:#006B3C;
}

select,
input,
textarea,
button{
width:100%;
padding:12px;
margin:10px 0;
box-sizing:border-box;
}

button{
background:#006B3C;
color:#fff;
border:none;
border-radius:6px;
cursor:pointer;
}
</style>

</head>
<body>

<div class="box">

<h2>✏️ পণ্য সম্পাদনা</h2>

<select id="productList">
<option value="">পণ্য নির্বাচন করুন</option>
</select>

<input type="text" id="name" placeholder="পণ্যের নাম">

<input type="number" id="regularPrice" placeholder="রেগুলার দাম">

<input type="number" id="offerPrice" placeholder="অফার দাম">

<textarea id="description" rows="4" placeholder="পণ্যের বিবরণ"></textarea>
<input type="text" id="image" placeholder="ছবির Direct Link">
<h3>বর্তমান ছবি</h3>

<div id="oldImages"></div>

<input type="text" id="newImage" placeholder="নতুন ছবির Direct Link">

<input type="text" id="sizes" placeholder="সাইজ (19,20,21)">

<input type="text" id="colors" placeholder="রং (সাদা,কালো)">

<input type="text" id="category" placeholder="ক্যাটাগরি (tupi,honey,attar)">

<button onclick="updateProduct()">💾 Update</button>

</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  doc,
  getDoc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDMQSGBuHukkUaJdktUeaA6-4xnSRKaPjs",
  authDomain: "habib-insaf-shop.firebaseapp.com",
  projectId: "habib-insaf-shop",
  storageBucket: "habib-insaf-shop.firebasestorage.app",
  messagingSenderId: "1061560355803",
  appId: "1:1061560355803:web:fde04cfdd52ecabd20f5fe"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let selectedId = "";
let productData = {};

const productList = document.getElementById("productList");

const querySnapshot = await getDocs(collection(db, "products"));

querySnapshot.forEach((docSnap) => {

  productList.innerHTML += `
    <option value="${docSnap.id}">
      ${docSnap.data().name}
    </option>
  `;

});
productList.onchange = async function () {
‎
‎  selectedId = this.value;
‎
‎  if (!selectedId) return;
‎
‎  const snap = await getDoc(doc(db, "products", selectedId));
‎
‎  if (!snap.exists()) return;
‎
‎  productData = snap.data();
‎
‎  document.getElementById("name").value = productData.name || "";
‎  document.getElementById("regularPrice").value = productData.regularPrice || "";
‎  document.getElementById("offerPrice").value = productData.offerPrice || "";
‎  document.getElementById("description").value = productData.description || "";
‎
‎  document.getElementById("sizes").value =
‎    productData.sizes ? productData.sizes.join(",") : "";
‎
‎  document.getElementById("colors").value =
‎    productData.colors ? productData.colors.join(",") : "";
‎
‎  document.getElementById("category").value =
‎    productData.category || "";
‎
‎  const oldImages = document.getElementById("oldImages");
‎  oldImages.innerHTML = "";
‎
‎  if (productData.images) {
‎
‎    productData.images.forEach((img, index) => {
‎
‎      oldImages.innerHTML += `
‎        
‎<div style="margin-bottom:10px;padding:8px;border:1px solid #ddd;border-radius:6px;">
‎  <small>ছবি ${index + 1}</small><br>
‎  <input type="text" value="${img}" readonly style="width:100%;">
‎  <button type="button"
‎    onclick="deleteImage(${index})"
‎    style="margin-top:5px;background:red;color:white;border:none;padding:6px 10px;border-radius:5px;">
‎    🗑️ ছবি মুছুন
‎  </button>
‎</div>
‎`;
‎
‎    });
‎
};
};
window.updateProduct = async function () {

  if (!selectedId) {
    alert("আগে একটি পণ্য নির্বাচন করুন");
    return;
  }

  try {

    // পুরনো ছবিগুলো রেখে দিচ্ছি
    let images = productData.images || [];

    // নতুন ছবি
    const newImage = document.getElementById("newImage").value.trim();

    // যদি নতুন লিংক লেখা হয় তাহলে শেষে যোগ হবে
    if (newImage !== "") {
      images.push(newImage);
    }

    await updateDoc(doc(db, "products", selectedId), {

      name: document.getElementById("name").value,

      regularPrice: Number(document.getElementById("regularPrice").value),

      offerPrice: Number(document.getElementById("offerPrice").value),

      description: document.getElementById("description").value,

      sizes: document.getElementById("sizes").value
        .split(",")
        .map(s => s.trim())
        .filter(s => s),

      colors: document.getElementById("colors").value
        .split(",")
        .map(c => c.trim())
        .filter(c => c),

      category: document.getElementById("category").value,

      images: images

    });

    alert("✅ পণ্য সফলভাবে আপডেট হয়েছে");

    document.getElementById("newImage").value = "";

    await productList.onchange.call(productList);

  } catch (error) {

    console.error(error);
    alert("❌ আপডেট করা যায়নি");

  }

};
‎
‎window.deleteImage = async function(index){
‎
‎  if(!confirm("এই ছবিটি মুছতে চান?")) return;
‎
‎  productData.images.splice(index,1);
‎
‎  try{
‎
‎    await updateDoc(doc(db,"products",selectedId),{
‎      images: productData.images
‎    });
‎
‎    alert("✅ ছবি মুছে ফেলা হয়েছে");
‎
‎    productList.onchange();
‎
‎  }catch(error){
‎
‎    console.error(error);
‎    alert("❌ ছবি মুছতে সমস্যা হয়েছে");
‎
‎  }
‎
‎};
‎</script>
‎
‎</body>
‎</html>
