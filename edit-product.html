<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>পণ্য সম্পাদনা</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f5f5;
padding:20px;
}

.box{
max-width:450px;
margin:auto;
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.2);
}

h2{
text-align:center;
color:#006B3C;
}

select,
input,
textarea,
button{
width:100%;
padding:12px;
margin:10px 0;
box-sizing:border-box;
}

button{
background:#006B3C;
color:#fff;
border:none;
border-radius:6px;
cursor:pointer;
}
</style>

</head>
<body>

<div class="box">

<h2>✏️ পণ্য সম্পাদনা</h2>

<select id="productList">
<option value="">পণ্য নির্বাচন করুন</option>
</select>

<input type="text" id="name" placeholder="পণ্যের নাম">

<input type="number" id="regularPrice" placeholder="রেগুলার দাম">

<input type="number" id="offerPrice" placeholder="অফার দাম">

<textarea id="description" rows="4" placeholder="পণ্যের বিবরণ"></textarea>
<input type="text" id="image" placeholder="ছবির Direct Link">

<input type="text" id="sizes" placeholder="সাইজ (19,20,21)">

<input type="text" id="colors" placeholder="রং (সাদা,কালো)">

<input type="text" id="category" placeholder="ক্যাটাগরি (tupi,honey,attar)">

<button onclick="updateProduct()">💾 Update</button>

</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  doc,
  getDoc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDMQSGBuHukkUaJdktUeaA6-4xnSRKaPjs",
  authDomain: "habib-insaf-shop.firebaseapp.com",
  projectId: "habib-insaf-shop",
  storageBucket: "habib-insaf-shop.firebasestorage.app",
  messagingSenderId: "1061560355803",
  appId: "1:1061560355803:web:fde04cfdd52ecabd20f5fe"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let selectedId = "";

const productList = document.getElementById("productList");

const querySnapshot = await getDocs(collection(db, "products"));

querySnapshot.forEach((docSnap) => {
  productList.innerHTML += `
    <option value="${docSnap.id}">
      ${docSnap.data().name}
    </option>
  `;
});
productList.onchange = async function () {

  selectedId = this.value;

  if (!selectedId) return;

  const snap = await getDoc(doc(db, "products", selectedId));

  if (snap.exists()) {

    const p = snap.data();

    document.getElementById("name").value = p.name || "";
    document.getElementById("regularPrice").value = p.regularPrice || "";
    document.getElementById("offerPrice").value = p.offerPrice || "";
    document.getElementById("description").value = p.description || "";
    document.getElementById("image").value = (p.images && p.images[0]) ? p.images[0] : "";

    document.getElementById("sizes").value =
      p.sizes ? p.sizes.join(",") : "";

    document.getElementById("colors").value =
      p.colors ? p.colors.join(",") : "";

    document.getElementById("category").value =
      p.category || "";
  }

};
window.updateProduct = async function () {

  if (!selectedId) {
    alert("আগে একটি পণ্য নির্বাচন করুন");
    return;
  }

  try {

    await updateDoc(doc(db, "products", selectedId), {

      name: document.getElementById("name").value,

      regularPrice: Number(document.getElementById("regularPrice").value),

      offerPrice: Number(document.getElementById("offerPrice").value),

      description: document.getElementById("description").value,

      images: [
        document.getElementById("image").value
      ],

      sizes: document.getElementById("sizes").value
        .split(",")
        .map(s => s.trim())
        .filter(s => s),

      colors: document.getElementById("colors").value
        .split(",")
        .map(c => c.trim())
        .filter(c => c),

      category: document.getElementById("category").value

    });

    alert("✅ পণ্য সফলভাবে আপডেট হয়েছে");

  } catch (error) {

    console.error(error);
    alert("❌ আপডেট করা যায়নি");

  }

};
</script>

</body>
</html>
